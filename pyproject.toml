[project]
name = "tui-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.1.2",
    "psutil>=7.2.2",
    "recurring-ical-events>=3.8.2",
    "textual>=8.2.7",
    "textual-dev>=1.8.0",
]

[project.scripts]
dashboard = "dashboard.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
