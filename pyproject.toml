[project]
name = "tui-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.1.2",
    "psutil>=7.2.2",
    "recurring-ical-events>=3.8.2",
    "textual>=8.2.7",
    "textual-dev>=1.8.0",
    "tomlkit>=0.15.2",
]

[project.scripts]
dashboard = "dashboard.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern Python syntax
    "SIM",      # simplifications
    "RUF",      # ruff-specific rules
]
ignore = [
    "RUF012",   # Textual's BINDINGS/CSS class attributes are meant to be plain lists
]

[tool.ruff.lint.isort]
known-first-party = ["dashboard"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true